# Linkitylink short links: https://dev.linkityl.ink/<name> and /<n>/<name>, on the
# dev droplet (dev.8as.world). Install next to that droplet's main config:
#
#   sudo certbot certonly --nginx -d dev.linkityl.ink      # certificate first: nginx
#                                                # won't load a config whose
#                                                # certificate is missing
#   sudo cp dev.linkityl.ink.nginx.conf /etc/nginx/sites-available/dev.linkityl.ink
#   sudo ln -s /etc/nginx/sites-available/dev.linkityl.ink /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Everything is handed to savage's /l/ routes (savage/src/server/node/
# shortlinks.js). savage needs, in its environment:
#   SHORT_LINK_BASE=https://dev.linkityl.ink/
#   CARD_PAGES_URL=https://dev.8as.world/savage/
# The bare domain redirects to Linkitylink's App Store listing.

server {
    listen 80;
    server_name dev.linkityl.ink;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dev.linkityl.ink;

    ssl_certificate /etc/letsencrypt/live/dev.linkityl.ink/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.linkityl.ink/privkey.pem;

    # $request_uri is the path exactly as the browser sent it, still
    # percent-encoded, so names like zoë arrive intact; a plain
    # "proxy_pass http://localhost:3012/l/;" would pass nginx's decoded copy.
    # With a variable in it, proxy_pass resolves its host at request time,
    # hence 127.0.0.1 rather than localhost (no resolver needed).
    location / {
      proxy_pass http://127.0.0.1:3012/l$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
}
